[project]
name = "llm-adventure-benchmark"
version = "0.1.0"
description = "A deterministic tabletop-inspired benchmark for LLM agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adventure-bench = "benchmark.runner:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["benchmark*"]
